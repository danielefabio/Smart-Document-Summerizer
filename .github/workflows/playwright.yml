name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: pnpm/action-setup@v4
      with:
        version: 12.6.0

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # Foundamental Step: installs the real browsers of Playwright (Chromium, Firefox) in Linux container
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps

    # Start the application and run tests
    - name: Run Playwright tests
      run: pnpm exec playwright test

    # If a test fails, GitHub loads a screenshot/video of the error as attachment
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30